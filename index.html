<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kekkonen.net</title>
  <meta name="description" content="kekkonen.net">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --fg: #f5f5f5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "Inter Tight", Inter, ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      font-weight: 200;
      font-size: clamp(2.6rem, 9vw, 6.2rem);
      letter-spacing: -0.055em;
      line-height: 0.95;
      text-shadow: 0 0 48px rgba(255,255,255,0.08);
    }
  </style>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <main>
    <h1>kekkonen.net</h1>
  </main>
  <script>
    const canvas = document.getElementById("stars");
    const ctx = canvas.getContext("2d");
    const stars = [];
    let w = 0, h = 0, raf;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function spawn(count) {
      stars.length = 0;
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.15 + 0.2,
          s: Math.random() * 0.18 + 0.03,
          a: Math.random() * Math.PI * 2,
          tw: Math.random() * 0.8 + 0.2,
          drift: (Math.random() - 0.5) * 0.12
        });
      }
    }

    function tick(t) {
      ctx.clearRect(0, 0, w, h);
      for (const star of stars) {
        star.y -= star.s;
        star.x += star.drift;
        if (star.y < -4) { star.y = h + 4; star.x = Math.random() * w; }
        if (star.x < -4) star.x = w + 4;
        if (star.x > w + 4) star.x = -4;
        const twinkle = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 0.0015 * star.tw + star.a));
        ctx.beginPath();
        ctx.fillStyle = `rgba(255,255,255,${twinkle})`;
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
      }
      raf = requestAnimationFrame(tick);
    }

    function start() {
      cancelAnimationFrame(raf);
      resize();
      const count = Math.round(Math.min(w, h) * 0.22);
      spawn(Math.max(80, Math.min(count, 220)));
      raf = requestAnimationFrame(tick);
    }

    window.addEventListener("resize", start);
    start();
  </script>
</body>
</html>
