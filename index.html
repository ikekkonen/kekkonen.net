<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kekkonen.net</title>
  <meta name="description" content="kekkonen.net">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --fg: #f4f4f5;
      --muted: #8a8a8a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100dvh;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(255,255,255,0.04), transparent 55%),
        var(--bg);
    }

    main {
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-weight: 300;
      font-size: clamp(2.4rem, 8vw, 5.5rem);
      letter-spacing: -0.06em;
      line-height: 1;
    }

    p {
      margin-top: 1.25rem;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <main>
    <h1>kekkonen.net</h1>
  </main>
</body>
</html>
